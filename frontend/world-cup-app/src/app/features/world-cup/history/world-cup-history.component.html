<ng-container *ngIf="pageState as pageState">
  <div class="empty-state" *ngIf="pageState.loading">
    <div class="empty-icon">⏳</div>
    <p>Cargando historial de mundiales...</p>
  </div>

  <div class="empty-state" *ngIf="!pageState.loading && pageState.errorMessage">
    <div class="empty-icon">⚠️</div>
    <p>{{ pageState.errorMessage }}</p>
  </div>

  <ng-container *ngIf="!pageState.loading && !pageState.errorMessage">
    <div class="empty-state mt-16" *ngIf="pageState.totalWorldCups === 0">
      <div class="empty-icon">📭</div>
      <p>No hay registro de mundiales finalizados.</p>
    </div>

    <ul class="world-cups-history" *ngIf="pageState.worldCups.length > 0">
      <li class="card world-cups-history-card" *ngFor="let worldCup of pageState.worldCups">
        {{pageState.worldCups}} 
      </li>
    </ul>
  </ng-container>

</ng-container>
